services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: takeaway_bootstrap
      POSTGRES_PASSWORD: ${DB_BOOTSTRAP_PASSWORD:-}
      POSTGRES_DB: takeaway
      MIGRATION_DB_USER: takeaway_owner
      MIGRATION_DB_PASSWORD: ${DB_MIGRATION_PASSWORD:-}
      RUNTIME_DB_USER: takeaway_runtime
      RUNTIME_DB_PASSWORD: ${DB_RUNTIME_PASSWORD:-}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/01-roles.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    networks: [database]

  migrate:
    image: ${APP_IMAGE:-takeaway-app:local}
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      MIGRATION_DATABASE_URL: postgresql+psycopg://takeaway_owner:${DB_MIGRATION_PASSWORD:-}@db:5432/takeaway
      MIGRATION_RUNTIME_ROLE: takeaway_runtime
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: "no"
    networks: [database]

  app:
    image: ${APP_IMAGE:-takeaway-app:local}
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://takeaway_runtime:${DB_RUNTIME_PASSWORD:-}@db:5432/takeaway
      JWT_SECRET: ${JWT_SECRET:-}
      PLATFORM_CURRENCY: ${PLATFORM_CURRENCY:-EUR}
      PAYMENT_GATEWAY: mock
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 30s
    networks: [database, proxy]

  nginx:
    image: nginx:stable
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${TLS_CERT_DIR:-./.certs}:/etc/nginx/tls:ro
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://localhost}
      NGINX_ENVSUBST_FILTER: "^(PUBLIC_HOST|PUBLIC_ORIGIN)$$"
    ports:
      - "80:80"
      - "443:443"
    healthcheck:
      test: [CMD, nginx, -t, -q]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    networks: [edge, proxy]

networks:
  database:
    internal: true
  proxy:
    internal: true
  edge:

volumes:
  postgres_data:
