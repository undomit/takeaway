events {}
http {
    # Task 022 adds TLS/public listeners, limits and operational configuration.
    log_format request_json escape=json
        '{"event":"proxy_request","request_id":"$request_id",'
        '"method":"$request_method","status":$status,"duration_seconds":$request_time}';
    access_log /dev/stdout request_json;
    error_log /dev/stderr warn;
    server {
        listen 80;
        location / {
            proxy_pass http://app:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }
    }
}
