worker_processes auto;
events { worker_connections 1024; }
http {
    # Never trust a client-supplied forwarded chain. Only this proxy is public.
    map $request_method $post_client_key {
        default "";
        POST $binary_remote_addr;
    }
    limit_req_zone $post_client_key zone=login:10m rate=5r/m;
    limit_req_zone $post_client_key zone=order_create:10m rate=10r/m;
    limit_req_status 429;
    limit_req_log_level notice;

    log_format request_json escape=json
        '{"event":"proxy_request","request_id":"$request_id",'
        '"method":"$request_method","status":$status,"duration_seconds":$request_time}';
    access_log /dev/stdout request_json;
    # Default nginx error records may echo URLs/queries. Access records above
    # retain request failures without private input; critical process errors remain.
    error_log /dev/stderr crit;
    server_tokens off;

    client_max_body_size 64k;
    client_body_buffer_size 16k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 30s;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    proxy_request_buffering on;
    proxy_buffering on;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_hide_header X-Request-ID;
    add_header X-Request-ID $request_id always;

    gzip on;
    gzip_min_length 256;
    gzip_types application/json;
    gzip_vary on;
    gzip_proxied any;

    upstream takeaway_app { server app:8000; keepalive 16; }
    include /etc/nginx/conf.d/*.conf;
}
