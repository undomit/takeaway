name: Backend checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.6'
          enable-cache: true
      - name: Install Python
        run: uv python install 3.12
      - name: Configure disposable test database
        run: cp .env.test.example .env.test
      - name: Start PostgreSQL with separate owner/runtime roles
        run: docker compose -p takeaway-test -f docker-compose.yml -f docker-compose.test.yml up -d --wait db
      - name: Locked checks, serial test suites and isolated migration verification
        run: sh scripts/ci.sh
      - name: Database diagnostics on failure
        if: failure()
        run: docker compose -p takeaway-test -f docker-compose.yml -f docker-compose.test.yml logs --no-color db
      - name: Remove disposable test resources
        if: always()
        run: docker compose -p takeaway-test -f docker-compose.yml -f docker-compose.test.yml down -v
